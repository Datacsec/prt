const levelLabels = ['Direction', 'Sous-direction', 'Sous-sous-direction']

// ---- État ----
const search = ref('')
const expanded = ref(new Set([1]))

// ---- Logique ----
function matches(node, q) {
  if (node.name.toLowerCase().includes(q) || node.responsable.toLowerCase().includes(q)) return true
  return node.children.some((c) => matches(c, q))
}

const rows = computed(() => {
  const q = search.value.trim().toLowerCase()
  const out = []
  const walk = (nodes, depth) => {
    for (const n of nodes) {
      if (q && !matches(n, q)) continue
      out.push({ ...n, depth, hasChildren: n.children.length > 0 })
      const open = q ? true : expanded.value.has(n.id)
      if (open && n.children.length) walk(n.children, depth + 1)
    }
  }
  walk(tree.value, 0)
  return out
})

function toggle(id) {
  const next = new Set(expanded.value)
  next.has(id) ? next.delete(id) : next.add(id)
  expanded.value = next
}

function allIds(nodes, acc = []) {
  for (const n of nodes) {
    if (n.children.length) acc.push(n.id)
    allIds(n.children, acc)
  }
  return acc
}

const expandAll = () => (expanded.value = new Set(allIds(tree.value)))
const collapseAll = () => (expanded.value = new Set())

function initials(name) {
  return name
    .replace(/LOD\d_/, '')
    .split(/[\s_]+/)
    .filter(Boolean)
    .slice(0, 2)
    .map((w) => w[0].toUpperCase())
    .join('')
}

const avatarColors = ['bg-slate-800', 'bg-blue-500', 'bg-emerald-600']
